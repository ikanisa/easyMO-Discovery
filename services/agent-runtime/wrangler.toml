# Cloudflare Worker Configuration for OpenAI Agents SDK
# https://developers.cloudflare.com/workers/

name = "easymo-agent-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables are set in Cloudflare Dashboard or via wrangler secret
# Required:
# - OPENAI_API_KEY
# - SUPABASE_URL
# - SUPABASE_ANON_KEY (or service role key for tool access)
# Optional:
# - GEMINI_API_KEY (for optional Gemini tools)
# - GOOGLE_MAPS_API_KEY (for optional Google Maps tools)

[env.production]
name = "easymo-agent-worker"
routes = [
  { pattern = "api.yourapp.com", zone_name = "yourapp.com" }
]

[env.development]
name = "easymo-agent-worker-dev"

