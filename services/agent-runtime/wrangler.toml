# Cloudflare Worker Configuration for OpenAI Agents SDK
# https://developers.cloudflare.com/workers/

name = "easymo-agent-worker"
main = "src/index.ts"
# Compatibility date: Update quarterly or when new features are needed
# See docs/deploy/workers-runtime.md for update policy
compatibility_date = "2025-01-27"
# nodejs_compat: Required for OpenAI SDK and other Node.js dependencies
# See docs/deploy/workers-runtime.md for bundle impact and alternatives
compatibility_flags = ["nodejs_compat"]

# ============================================
# Environment Variables
# ============================================
# SECRETS: Use 'wrangler secret put' or Cloudflare Dashboard
#   - OPENAI_API_KEY (required)
#   - SUPABASE_URL (required)
#   - SUPABASE_ANON_KEY (required)
#   - SUPABASE_SERVICE_ROLE_KEY (optional)
#   - GEMINI_API_KEY (optional)
#   - GOOGLE_MAPS_API_KEY (optional)
#   - SERPAPI_API_KEY (optional)
#   - OAUTH_CLIENT_SECRET (optional)
#   - CRON_SECRET (optional)
#
# NON-SECRET VARS: Can be set in [vars] section below or via Dashboard
#   - RATE_LIMIT_MAX_REQUESTS (default: 100)
#   - RATE_LIMIT_WINDOW_SECONDS (default: 60)
#   - OAUTH_CLIENT_ID, OAUTH_REDIRECT_URI, etc. (optional)

# Non-secret variables (can be set here or in Dashboard)
# For secrets, use: wrangler secret put VARIABLE_NAME
[vars]
# Rate limiting configuration
RATE_LIMIT_MAX_REQUESTS = "100"
RATE_LIMIT_WINDOW_SECONDS = "60"
# Uncomment and configure as needed:
# OAUTH_CLIENT_ID = "your-oauth-client-id"
# OAUTH_REDIRECT_URI = "https://your-worker.workers.dev/auth/callback"
# OAUTH_AUTHORIZATION_URL = "https://oauth-provider.com/authorize"
# OAUTH_TOKEN_URL = "https://oauth-provider.com/token"
# WORKER_URL = "https://your-worker.workers.dev"

[env.production]
name = "easymo-agent-worker"
# Uncomment and configure if using custom domain:
# routes = [
#   { pattern = "api.yourdomain.com", zone_name = "yourdomain.com" }
# ]

[env.production.vars]
# Rate limiting configuration (inherited from top-level, can override)
RATE_LIMIT_MAX_REQUESTS = "100"
RATE_LIMIT_WINDOW_SECONDS = "60"
# Override for production if needed:
# RATE_LIMIT_MAX_REQUESTS = "200"

[env.development]
name = "easymo-agent-worker-dev"

[env.development.vars]
# Rate limiting configuration (inherited from top-level, can override)
RATE_LIMIT_MAX_REQUESTS = "100"
RATE_LIMIT_WINDOW_SECONDS = "60"
# Override for development if needed:
# RATE_LIMIT_MAX_REQUESTS = "1000"
