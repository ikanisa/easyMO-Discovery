<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Page Not Found - easyMO</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 20px;
      }
      .card {
        max-width: 320px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: rgba(226, 232, 240, 0.8);
      }
      button {
        border: none;
        background: #2563eb;
        color: white;
        padding: 12px 18px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page Not Found</h1>
      <p>
        The page you're looking for doesn't exist. You'll be redirected to the home page.
      </p>
      <button onclick="window.location.href='/'">Go Home</button>
    </div>
    <script>
      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    </script>
  </body>
</html>
